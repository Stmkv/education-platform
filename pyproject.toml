[project]
name = "educational-platform"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.16.4",
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "domain",
    "application",
    "infra",
    "presentation",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.isort.sections]
domain = ["app.domain"]
application = ["app.application"]
infra = ["app.infrastructure"]
presentation = ["app.presentation"]

[tool.ruff.lint]
extend-ignore = ["B008"]
